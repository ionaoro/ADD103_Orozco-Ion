<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Bootstrap: Components& Utilities</title>
</head>
<body>
    <header class="container-fluid text-center">
        <h1>Gaming Consoles, and Handhelds:</h1>
    </header>

    <main class="container">
        <h2>Remembering The Beasts Of Each Era</h2>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>PS3  </h3>
                    <img class="img-fluid border rounded shadow-sm" src="images/ps3.jpg" alt="Photo of Sony PlayStation 3 in Black">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>Xbox 360</h3>
                     <img class="img-fluid border rounded shadow-sm" src="images/x-bot.jpg"
                      alt="Photo of Microsoft Xbox 360 in classic white, with colorful buttons on the controller">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>NES  </h3>
                    <img class="img-fluid border rounded shadow-sm" src="images/retro-game.jpg" alt="Photo of a basic game room featuring a CRT Tv connected to a uniquely coloredNES Console">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>GBA SP  </h3>
                    <img class="img-fluid border rounded shadow-sm" src="images/SP_photo.jpg" alt="Photo of Nintendo Game Boy Advance SP in Silver with a Pokemon cartridge beside it">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>PS Vita </h3>
                        <img class="img-fluid border rounded shadow-sm" src="images/vita.jpg"
                    alt="Photo of Sony Handheld PS Vita in Black">
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100">
                    <div class="card-body"><h3>NES Joystick  </h3>
                    <img class="img-fluid border rounded shadow-sm" src="images/nes-joystick.jpg" alt="Photo of a classic Nintendo Entertainment System Joystick accessory with bright red buttons">
                    </div>
                </div>
            </div>
        </div>
    </main>
      <div class="content">
            <p> Here you can see the absolute <bold>MONSTERS</bold> from the gaming industry: </p>
        </div>
    <footer>
          <h3>&copy;Popular Gaming Consoles and Handhelds</h3>
          <a href="../../index.html">Home</a>
    </footer>
