<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
     <main class="page">
        <div class="header">
      <h1>Costume Ideas</h1>
      <p class="hint">
        To view alternative options: Adjust the index page size!
      </p>
      </div>
      <!-- https://www.w3schools.com/tags/tag_picture.asp code based on w3schools -->
<figure class="photo">
        <picture>
          <!-- 📱 Phone/small screens: use the close-up file -->
          <source
            media="(max-width: 699px)"
            srcset="images/cost-1.jpg"
            type="image/jpeg"
          />
          <!-- 🖥️ Desktop/large screens: use the wide landscape file -->
          <source
            media="(min-width: 700px)"
            srcset="images/cost-1.webp"
            type="image/webp"
          />
          <img
            src="images/cost-1.jpg"
            alt="Costume idea."
            loading="lazy"
            decoding="async"
          />
        </picture>
        <figcaption>
          something should be here...
          </figcaption>
      </figure>
      <figure class="photo">
      
        <picture>
          <source
            media="(max-width: 699px)"
            srcset="images/cost-6.jpg"
            type="image/jpeg"
          />
          <source
            media="(min-width: 700px)"
            srcset="images/cost-5.jpg"
            type="image/jpeg"
          />
          <img
            src="images/cost-3.jpg"
            alt="Dramatically lit steam punk styled gas mask with large sharp spikes around the forehead and mouth piece.."
            loading="lazy"
            decoding="async"
          />
        </picture>
          <figcaption>
         Here we have two COOL options for history themed costumes,
           you could either go the Sci-Fi route, with this awesome 
           outfit! And alternatively you can go for something much 
           more simple like this pirate costume.
        </figcaption>
      </figure>

      <h2 class="demo-title"><code>srcset</code> + <code>sizes</code> (resolution switching)</h2>
      <p class="hint">
        Same photo, exported at multiple widths. The browser chooses the
        smallest file that still looks sharp.
      </p>

      <figure class="photo">
     
        <img
          src="images/cost-4.jpg"
          srcset="
            images/cost-4-480.jpg 480w,
            images/cost-4-960.jpg 960w,
            images/cost-4-1440.jpg 1440w
          "
          sizes="(max-width: 699px) 100vw, 60rem"
          alt="A waterfall cascading down rock steps into a pool."
          loading="lazy"
          decoding="async"
        />
      </figure>
    </main>
    </body>
</html>
