<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Costume Ideas</title>
</head>
<body>
     <main class="page">
        <div class="header">
      <h1>Costume Ideas</h1>
      <p class="hint">
        To view alternative options: Adjust the index page size!
      </p>
      </div>
      <!-- https://www.w3schools.com/tags/tag_picture.asp code based on w3schools -->
<figure class="photo">
        <picture>
          <!-- 📱 Phone/small screens: use the close-up file -->
          <source
            media="(max-width: 699px)"
            srcset="images/cost-1.jpg"
            type="image/jpeg"
          />
          <!-- 🖥️ Desktop/large screens: use the wide landscape file -->
          <source
            media="(min-width: 700px)"
            srcset="images/cost-1.webp"
            type="image/webp"
          />
          <img
            src="images/cost-1.jpg"
            alt="Costume idea."
            loading="lazy"
            decoding="async"
          />
        </picture>
        <figcaption>
          A <bold>CLASSIC</bold> Zombie costume! Achieved by advanced makeup art and facial prosthetics!
          </figcaption>
      </figure>
      <figure class="photo">
      
        <picture>
          <source
            media="(max-width: 699px)"
            srcset="images/cost-6.jpg"
            type="image/jpeg"
          />
          <source
            media="(min-width: 700px)"
            srcset="images/cost-5.jpg"
            type="image/jpeg"
          />
          <img
            src="images/cost-6.jpg"
            alt=" Feminine costume of a platinum colored onesie, with metallic accents, brown leggings, platinum long sleeve gloves, and stylized glasses."
            loading="lazy"
            decoding="async"
          />
        </picture>
          <figcaption>
         Here we have two COOL options for history themed costumes,
           you could either go the Sci-Fi route, with this awesome 
           outfit! And alternatively you can go for something much 
           more simple like this pirate costume.
        </figcaption>
      </figure>

      <h2 class="demo-title"> Maybe Something For The Lovebirds!</h2>
     Now this costume idea, is quick and painless, yet still effective!
      </p>

      <figure class="photo">
     
        <img
          src="images/cost-4.jpg"
          alt="A young couple dressed in wedding  attire, accompanied with clown makeup."
          loading="lazy"
          decoding="async"
        />
      </figure>
    </main>
    <div class="footer">
      <h2>What's Your GO TO Costume??</h2>
      <p><a href="../../index.html">HOME</a></p>
    </div>
    </body>
</html>
