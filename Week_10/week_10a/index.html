<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
     <main class="page">
      <h1>&lt;picture&gt; element demo</h1>
      <p class="hint">
        Responsive images = the browser downloads the “right” image file for
        the screen size (and display density).
      </p>
      <!-- https://www.w3schools.com/tags/tag_picture.asp code based on w3schools -->
<figure class="photo">
        <!-- 🖼️ <picture> = art direction (different crops/compositions for different screens). -->
        <!-- 📱💻🖥️ The browser checks <source> tags top-to-bottom and picks the FIRST one whose media query matches. -->
        <!-- 🧠 The <img> is the fallback AND the place we put alt text (for accessibility). -->
        <picture>
          <!-- 📱 Phone/small screens: use the close-up file -->
          <source
            media="(max-width: 699px)"
            srcset="images/lookout_closeup.webp"
            type="image/webp"
          />
          <!-- 🖥️ Desktop/large screens: use the wide landscape file -->
          <source
            media="(min-width: 700px)"
            srcset="images/lookout.webp"
            type="image/webp"
          />
           <img
            src="images/lookout.webp"
            alt="A lookout point with a sweeping view of the landscape."
            loading="lazy"
            decoding="async"
          />
        </picture>
        <figcaption>
          Uses <code>&lt;picture&gt;</code> with <code>media</code> to choose
          between <code>lookout_closeup.webp</code> (small screens) and
          <code>lookout.webp</code> (large screens).
        </figcaption>
      </figure>
      <figure class="photo">
        <!-- 🏞️ Same idea: <picture> lets us swap images based on screen size (art direction). -->
        <picture>
          <source
            media="(max-width: 699px)"
            srcset="images/waterfall_1_close.webp"
            type="image/jpg"
          />
          <source
            media="(min-width: 700px)"
            srcset=""
            type="image/webp"
          />
          <img
            src="images/cost-3.jpg"
            alt="Sparky and Dot, rubber ducks, looking at a waterfall."
            loading="lazy"
            decoding="async"
          />
        </picture>
    </body>
</html>
